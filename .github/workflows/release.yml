name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write  # to create and publish the GitHub Release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: iwamot/actions/release-draft@437b9b2d8c3f6bc132577bed09b0ec19a4c41644 # v2.0.5
      - uses: iwamot/actions/release-publish@437b9b2d8c3f6bc132577bed09b0ec19a4c41644 # v2.0.5
