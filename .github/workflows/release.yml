name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    permissions:
      contents: write  # to create and publish the GitHub Release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: iwamot/actions/release-draft@bd44fb7fb4de34d7ce57d2195e8abb9a9fee345a # v2.9.0
      - uses: iwamot/actions/release-publish@bd44fb7fb4de34d7ce57d2195e8abb9a9fee345a # v2.9.0
