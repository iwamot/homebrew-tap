name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: write  # to create and publish the GitHub Release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: iwamot/actions/release-draft@e811a56926a7d215c7dad8ab65326e0e71fe3aed # v2.0.3
      - uses: iwamot/actions/release-publish@e811a56926a7d215c7dad8ab65326e0e71fe3aed # v2.0.3
